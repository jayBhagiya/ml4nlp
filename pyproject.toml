[project]
name = "graph-transformer-showcase"
version = "0.1.0"
description = "Focused reimplementation of A Generalization of Transformer Networks to Graphs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "torch==2.2.2",
    "torch-geometric>=2.6,<3",
    "wandb>=0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_transformer"]

